backend:
  name: git-gateway
  branch: main # Change to your primary branch if not main

local_backend: true # Enables editing locally using decaps proxy server

media_folder: "img"
public_folder: "img"

collections:
  - name: "pages"
    label: "Pages Data"
    files:
      - file: "data/team.json"
        label: "Team Members"
        name: "team"
        fields:
          - label: "Team Members List"
            name: "members"
            widget: "list"
            allow_add: true
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Profile Image", name: "image", widget: "image" }
              - { label: "Biography", name: "bio", widget: "text" }
      - file: "data/museum.json"
        label: "Museum Archive"
        name: "museum"
        fields:
          - label: "Archive Items"
            name: "items"
            widget: "list"
            allow_add: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category / Meta", name: "category", widget: "string" }
              - { label: "Featured Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Additional Image Paths (separated by |)", name: "additional_images", widget: "string", required: false }
